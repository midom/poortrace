name: Rust
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        features: ["", "static-llvm"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y llvm-18-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features '${{ matrix.features }}' -- -D warnings
        env:
          LLVM_CONFIG: llvm-config-18
      - name: Unit and integration tests
        run: bash scripts/ci-test.sh --locked --features '${{ matrix.features }}'
        env:
          LLVM_CONFIG: llvm-config-18
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: Native ptrace, SDT, typed argument, CPython, and Node tests
        run: |
          bash scripts/ci-test.sh --locked --features '${{ matrix.features }}' --test cli live_uprobes -- --ignored
          bash scripts/ci-test.sh --locked --features '${{ matrix.features }}' --test cli live_syscalls -- --ignored
          bash scripts/ci-test.sh --locked --features '${{ matrix.features }}' --test cli live_process_tree -- --ignored
          bash scripts/ci-test.sh --locked --features '${{ matrix.features }}' --test cli live_usdt -- --ignored
          bash scripts/ci-test.sh --locked --features '${{ matrix.features }}' --test cli live_python -- --ignored
          bash scripts/ci-test.sh --locked --features '${{ matrix.features }}' --test cli live_node -- --ignored
          bash scripts/ci-test.sh --locked --features '${{ matrix.features }}' --test process_coverage -- --ignored
          bash scripts/ci-test.sh --locked --features '${{ matrix.features }}' --test arguments -- --ignored
          bash scripts/ci-test.sh --locked --features '${{ matrix.features }}' --test expansion -- --ignored
          bash scripts/ci-test.sh --locked --features '${{ matrix.features }}' --test reliable -- --ignored
          bash scripts/ci-test.sh --locked --features '${{ matrix.features }}' --test function_scheduling -- --ignored
        env:
          LLVM_CONFIG: llvm-config-18
  fully-static:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      LLVM_CONFIG: llvm-config-18
      RUSTFLAGS: -C target-feature=+crt-static
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y llvm-18-dev zlib1g-dev libzstd-dev libtinfo-dev libxml2-dev ripgrep
      - run: bash scripts/ci-test.sh --locked
      - run: bash scripts/ci-test.sh --locked --test cli live_process_tree -- --ignored
      - run: bash scripts/ci-test.sh --locked --test cli live_usdt -- --ignored
      - run: cargo build --release --locked
      - name: Verify static executable and JIT
        run: |
          binary=target/${{ matrix.target }}/release/poortrace
          if readelf -d "$binary" | grep -q '(NEEDED)'; then
            echo "Executable depends on shared libraries"
            exit 1
          fi
          if readelf -l "$binary" | grep -q INTERP; then
            echo "Executable requires a dynamic loader"
            exit 1
          fi
          "$binary" -q -e 'BEGIN { printf("%d\n", 6 * 7); exit(); }' | grep -qx 42
      - name: Exercise release packaging on every build
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          version=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')
          bash scripts/package-release.sh "target/$RELEASE_TARGET/release/poortrace" "$version" "$RELEASE_TARGET"
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: sudo apt-get update && sudo apt-get install -y llvm-18-dev
      - run: cargo check --locked --all-targets
        env:
          LLVM_CONFIG: llvm-config-18

  managed-compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: "20"
            python: "3.11"
            go: "1.22.x"
          - os: ubuntu-24.04-arm
            node: "22"
            python: "3.12"
            go: "1.22.x"
          - os: ubuntu-24.04
            node: "24"
            python: "3.13"
            go: "1.24.x"
          - os: ubuntu-24.04-arm
            node: "24"
            python: "3.14"
            go: "1.24.x"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y llvm-18-dev golang-go
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Managed stack compatibility
        env:
          LLVM_CONFIG: llvm-config-18
        run: |
          bash scripts/ci-test.sh --locked --test managed python_versions -- --ignored --nocapture
          bash scripts/ci-test.sh --locked --test managed node_ -- --ignored --skip cooperative_ --nocapture
          bash scripts/ci-test.sh --locked --test managed go_ -- --ignored --skip go_perf --nocapture

  cooperative-runtimes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y llvm-18-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet tool install --tool-path /tmp/poortrace-dotnet-tools dotnet-stack --version 10.0.750501
      - run: npm ci --prefix adapters --ignore-scripts
      - name: Real JVM, .NET, Python async, JS async and WebAssembly adapters
        run: bash scripts/ci-test.sh --locked --test managed cooperative_ -- --ignored --nocapture
        env:
          LLVM_CONFIG: llvm-config-18
          DOTNET_STACK: /tmp/poortrace-dotnet-tools/dotnet-stack

  compressed-v8:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y llvm-18-dev
      - name: Fetch checksum-pinned experimental compressed Node fixture
        run: |
          curl -fL --retry 3 -o /tmp/node-pointer-compression.tar.xz https://unofficial-builds.nodejs.org/download/release/v20.0.0/node-v20.0.0-linux-x64-pointer-compression.tar.xz
          echo '5fe8c39a6536b28d5125be7adfb9da67e39ce7f165f58905a5cf5916f7670722  /tmp/node-pointer-compression.tar.xz' | sha256sum -c -
          tar -xJf /tmp/node-pointer-compression.tar.xz -C /tmp
      - name: Native compressed heap and frame resolution
        run: bash scripts/ci-test.sh --locked --test managed compressed_scope_live_function_frames -- --ignored --nocapture
        env:
          LLVM_CONFIG: llvm-config-18
          POORTRACE_NODE_BIN: /tmp/node-v20.0.0-linux-x64-pointer-compression/bin/node
